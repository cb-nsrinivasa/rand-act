apiVersion: automation.cloudbees.io/v1alpha1
kind: action
name: dummy action
inputs:
  string-val:  # id of input
    description: 'sample string'
    required: false


runs:
  using: composite
  steps:

    - id: invoke-action
      name: failing-step
      uses: docker://golang:1.20.3-alpine3.17 
      shell: sh
      run: |
        echo "asdf" && exit 1

    - id: invoke-action-1
      name: after-fail
      uses: docker://golang:1.20.3-alpine3.17 
      shell: sh
      run: |
        echo "asdf" 
        
  
    - id: invoke-action-2
      if: always()
      name: step with always
      uses: docker://golang:1.20.3-alpine3.17 
      shell: sh
      run: |
        echo "asdf" 
 
        s="${{inputs.string-val}}" 
        echo "${s:0:2}"   # first 5 chars
        echo "${s:2}"     # remaining chars (from index 5 to end)

    - id: checkout-action
      name: checkout-action
      uses: cloudbees-io/checkout@v2
      

        

